name: Java CI with Maven

permissions:
  contents: read

on:
  pull_request:
    branches: ["*"]
    paths-ignore: ["LICENSE", "README.md"]

jobs:
  call-maven-ci:
    uses: project-ncl/shared-github-actions/.github/workflows/maven-ci.yml@461b242bf215856b94e7b40f1ecfa06f7ebb1b45 # v0.0.26
    with:
      build_command: "mvn -B -V install -Dvalidate-format"
      upload_artifacts: true
