name: Java CI with Maven

permissions:
  contents: read

on:
  pull_request:
    branches: ["*"]
    paths-ignore: ["LICENSE", "README.md"]

jobs:
  call-maven-ci:
    uses: project-ncl/shared-github-actions/.github/workflows/maven-ci.yml@a27e6fba6b28bbb96881ec096e9c8ea5a538f481 # v0.0.22
    with:
      build_command: "mvn -B -V install -Dvalidate-format"
      upload_artifacts: true
