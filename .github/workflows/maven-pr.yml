name: Java CI with Maven

permissions:
  contents: read

on:
  pull_request:
    branches: ["*"]
    paths-ignore: ["LICENSE", "README.md"]

jobs:
  call-maven-ci:
    uses: project-ncl/shared-github-actions/.github/workflows/maven-ci.yml@af62bc3c8181df77581ddf64859f9bba9129fcad # v0.0.28
    with:
      build_command: "mvn -B -V install -Dvalidate-format"
      upload_artifacts: true
