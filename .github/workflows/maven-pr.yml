name: Java CI with Maven

permissions:
  contents: read

on:
  pull_request:
    branches: ["*"]
    paths-ignore: ["LICENSE", "README.md"]

jobs:
  call-maven-ci:
    uses: project-ncl/shared-github-actions/.github/workflows/maven-ci.yml@9735924b878ff3890cfaf16acb28e06531963ebf # v0.0.25
    with:
      build_command: "mvn -B -V install -Dvalidate-format"
      upload_artifacts: true
